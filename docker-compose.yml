version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: echogpt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/echogpt?schema=public
      - JWT_SECRET=supersecret123
      - JWT_EXPIRATION=15m
    depends_on:
      - db
    command: >
      sh -c "npx prisma migrate deploy && npm run start:prod"

volumes:
  pgdata:
